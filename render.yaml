# FREE Render Blueprint for TW-Labs Web Intel ($0/month).
# Render dashboard → New → Blueprint → pick this repo. See DEPLOYMENT.md.
#
#   webintel-api  Python web service on the FREE instance: runs the API and the
#                 tracker worker in one process. Free instances sleep after 15
#                 minutes without traffic, so a free pinger (cron-job.org) calls
#                 /healthz every 10 minutes to keep it — and the tracker — awake.
#   webintel      Free static site serving the dashboard and forwarding /api/*
#                 to webintel-api (same domain, so no CORS setup).
#   Database      NOT on Render (free Render Postgres is deleted after 30 days):
#                 a free Supabase project. Paste its Session pooler URL as
#                 DATABASE_URL when the Blueprint asks.
#
# The paid version (always-on, Render Postgres with backups) is render.paid.yaml.
services:
  - type: web
    name: webintel-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances have no pre-deploy step, so migrations run at start-up
    # (a no-op when the database is already current).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false            # Supabase "Session pooler" URL — you paste it at creation
      - key: EMBEDDED_WORKER
        value: "true"
      - key: RETENTION_DAYS
        value: "180"           # keeps the 500 MB free database comfortably under its limit
      - key: DB_POOL_SIZE
        value: "3"             # Supabase's free shared pooler allows few connections
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: WORKSPACE_NAME
        value: TechWiser Web Competitors
      # No login (team choice). To add one later: DASHBOARD_PASSWORD + SESSION_SECRET.

  - type: web
    name: webintel
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Order matters: first match wins. Real files (JS/CSS/images) are always
      # served before these rules.
      - type: rewrite
        source: /api/*
        destination: https://webintel-api-3aga.onrender.com/api/*
      - type: rewrite
        source: /healthz
        destination: https://webintel-api-3aga.onrender.com/healthz
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
