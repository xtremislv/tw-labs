# Serves the built dashboard and proxies API calls to the backend
# container so the browser only ever talks to one origin.

# Compresses the JS/CSS bundles nginx serves directly (the FastAPI side
# already does its own gzip via GZipMiddleware for /api/ JSON responses —
# see backend/app/main.py — this is nginx's equivalent for the static
# frontend, which never passes through that middleware).
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 500;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Deliberately no add_header here: the FastAPI app already sets its
        # own security headers on every response via app/main.py's
        # security_headers middleware, so adding nginx's own copy on top
        # would just send each header twice for no benefit — one source of
        # truth per response is easier to keep correct than two copies that
        # can drift out of sync.
    }

    location /healthz {
        proxy_pass http://api:8000/healthz;
    }

    # Vite's build hashes every filename under /assets/ by content, so a
    # cached copy is safe to keep forever — a content change always ships
    # under a new filename rather than overwriting this one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Same header set the API (backend/app/main.py) and Vercel deployment
    # path (vercel.json) already send — this is the third of three places
    # that can end up serving the dashboard's HTML/static assets, so it
    # needs its own copy here rather than inheriting one from either of the
    # other two paths. Scoped to this location (not the whole server block)
    # so it doesn't also get tacked onto the already-covered /api/ responses
    # above.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # Single-page app: any unmatched path falls back to index.html.
        try_files $uri $uri/ /index.html;
    }
}
